<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNTRUSTY — the calculator that lies half the time</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:        #100E0C;
    --panel:     #1B1815;
    --screen:    #0B0A08;
    --ink:       #F2ECE1;
    --dim:       #8A8175;
    --amber:     #FFB020;
    --lie-red:   #FF3B5C;
    --truth-cyan:#26E8C5;
    --key:       #26221D;
    --key-hi:    #322C24;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% -10%, #221c14 0%, transparent 55%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
  }

  .rig{
    width:100%;
    max-width:380px;
  }

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 4px;
  }
  .masthead h1{
    font-size:15px;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin:0;
    font-weight:700;
  }
  .masthead h1 span{ color:var(--amber); }
  .odds{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--dim);
    letter-spacing:.04em;
  }

  .device{
    background:linear-gradient(180deg, var(--panel), #151210);
    border-radius:18px;
    padding:18px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.04);
    border:1px solid #2a251e;
  }

  /* Trust strip */
  .trust-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:2px 6px 12px;
  }
  .trust-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .led{
    width:8px; height:8px;
    border-radius:50%;
    background:#3a352c;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
    transition:background .15s, box-shadow .15s;
  }
  .led.on-truth{ background:var(--truth-cyan); box-shadow:0 0 10px var(--truth-cyan); }
  .led.on-lie{ background:var(--lie-red); box-shadow:0 0 10px var(--lie-red); }

  /* Screen */
  .screen{
    background:var(--screen);
    border-radius:10px;
    padding:20px 16px 14px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
    border:1px solid #000;
  }
  .screen::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events:none;
  }
  .expr{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--dim);
    min-height:16px;
    letter-spacing:.02em;
  }
  .result{
    font-family:'JetBrains Mono', monospace;
    font-size:40px;
    font-weight:700;
    text-align:right;
    line-height:1.15;
    margin-top:6px;
    word-break:break-all;
    transition:color .2s;
  }
  .result.glitching{ animation:glitch .28s steps(2,end) 3; }
  @keyframes glitch{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-2px,1px); color:var(--lie-red); }
    50%{ transform:translate(2px,-1px); color:var(--truth-cyan); }
    75%{ transform:translate(-1px,0); }
    100%{ transform:translate(0,0); }
  }
  .verdict{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-align:right;
    margin-top:6px;
    min-height:14px;
    text-transform:uppercase;
  }
  .verdict.truth{ color:var(--truth-cyan); }
  .verdict.lie{ color:var(--lie-red); }

  /* Keypad */
  .pad{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
  }
  button{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    border:none;
    border-radius:9px;
    padding:14px 0;
    background:var(--key);
    color:var(--ink);
    cursor:pointer;
    transition:background .1s, transform .05s;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{ transform:scale(0.95); }
  button:hover{ background:var(--key-hi); }

  .op{ color:var(--amber); font-weight:700; }
  .op.active{ background:var(--amber); color:#1a1305; }
  .wide{ grid-column:span 2; }
  .clear{ color:var(--lie-red); }
  .equals{
    background:var(--amber);
    color:#1a1305;
    font-weight:700;
  }
  .equals:hover{ background:#ffc34d; }

  footer{
    text-align:center;
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--dim);
    letter-spacing:.03em;
  }
</style>
</head>
<body>

<div class="rig">
  <div class="masthead">
    <h1>UNTRUSTY <span>v2.0</span></h1>
    <div class="odds">ALWAYS WRONG</div>
  </div>

  <div class="device">
    <div class="trust-row">
      <div class="led" id="led"></div>
      <div class="trust-label" id="trustLabel">awaiting input</div>
    </div>

    <div class="screen">
      <div class="expr" id="expr">0</div>
      <div class="result" id="result">0</div>
      <div class="verdict" id="verdict">&nbsp;</div>
    </div>

    <div class="pad" id="pad">
      <button class="clear wide" data-action="clear">CLEAR</button>
      <button class="op" data-op="/">÷</button>
      <button class="op" data-op="*">×</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="-">−</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="+">+</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="equals" data-action="equals" rowspan="2" style="grid-row: span 2;">=</button>

      <button class="wide" data-num="0">0</button>
      <button data-num=".">.</button>
    </div>
  </div>

  <footer>every operator always performs the opposite operation</footer>
</div>

<script>
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  const verdictEl = document.getElementById('verdict');
  const led = document.getElementById('led');
  const trustLabel = document.getElementById('trustLabel');
  const pad = document.getElementById('pad');

  let firstNum = null;
  let operator = null;
  let currentInput = '0';
  let justEvaluated = false;

  function updateScreen(){
    resultEl.textContent = currentInput;
    if(firstNum !== null && operator){
      exprEl.textContent = `${firstNum} ${symbolFor(operator)}`;
    } else {
      exprEl.textContent = '0';
    }
  }

  function symbolFor(op){
    return { '+':'+', '-':'−', '*':'×', '/':'÷' }[op] || op;
  }

  function setOpHighlight(op){
    document.querySelectorAll('.op').forEach(b=>{
      b.classList.toggle('active', b.dataset.op === op);
    });
  }

  function swappedOp(n1, op, n2){
    switch(op){
      case '+': return n1 - n2;
      case '-': return n1 + n2;
      case '*': return n2 !== 0 ? n1 / n2 : NaN;
      case '/': return n1 * n2;
    }
  }

  function formatNum(n){
    if (Number.isNaN(n)) return 'ERR';
    if (!Number.isFinite(n)) return 'ERR';
    let s = Math.round(n * 1e8) / 1e8;
    return s.toString();
  }

  function playGlitch(){
    resultEl.classList.remove('glitching');
    void resultEl.offsetWidth; // restart animation
    resultEl.classList.add('glitching');
  }

  function doEquals(){
    if(firstNum === null || operator === null) return;
    const n2 = parseFloat(currentInput);
    if(Number.isNaN(n2)) return;

    const n1 = firstNum;
    const outcome = swappedOp(n1, operator, n2);

    exprEl.textContent = `${n1} ${symbolFor(operator)} ${n2} =`;
    playGlitch();

    setTimeout(()=>{
      currentInput = formatNum(outcome);
      resultEl.textContent = currentInput;

      if(currentInput === 'ERR'){
        verdictEl.textContent = 'division by zero';
        verdictEl.className = 'verdict lie';
        led.className = 'led on-lie';
        trustLabel.textContent = 'machine choked';
      } else {
        verdictEl.textContent = 'operator swapped';
        verdictEl.className = 'verdict lie';
        led.className = 'led on-lie';
        trustLabel.textContent = 'always wrong on purpose';
      }
    }, 260);

    firstNum = null;
    operator = null;
    justEvaluated = true;
    setOpHighlight(null);
  }

  pad.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.dataset.num !== undefined){
      const d = btn.dataset.num;
      if(justEvaluated){
        currentInput = (d === '.') ? '0.' : d;
        justEvaluated = false;
      } else if(currentInput === '0' && d !== '.'){
        currentInput = d;
      } else if(d === '.' && currentInput.includes('.')){
        // ignore extra dot
      } else {
        currentInput += d;
      }
      verdictEl.textContent = '\u00A0';
      verdictEl.className = 'verdict';
      updateScreen();
      return;
    }

    if(btn.dataset.op !== undefined){
      if(firstNum !== null && operator && !justEvaluated){
        doEquals();
        setTimeout(()=>{
          firstNum = parseFloat(currentInput);
          operator = btn.dataset.op;
          currentInput = '0';
          setOpHighlight(operator);
          updateScreen();
        }, 280);
        return;
      }
      firstNum = parseFloat(currentInput);
      operator = btn.dataset.op;
      currentInput = '0';
      justEvaluated = false;
      setOpHighlight(operator);
      updateScreen();
      return;
    }

    if(btn.dataset.action === 'clear'){
      firstNum = null; operator = null; currentInput = '0'; justEvaluated = false;
      verdictEl.textContent = '\u00A0';
      verdictEl.className = 'verdict';
      led.className = 'led';
      trustLabel.textContent = 'awaiting input';
      setOpHighlight(null);
      updateScreen();
      return;
    }

    if(btn.dataset.action === 'equals'){
      doEquals();
      return;
    }
  });

  updateScreen();
</script>

</body>
</html>
